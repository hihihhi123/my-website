<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập Quản Trị - Admin Portal</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .admin-login-box {
        width: 100%;
        max-width: 420px;
        background: #141414;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        border: 1px solid #333;
        border-top: 4px solid #e50914;
      }
      .admin-login-box h2 {
        text-align: center;
        color: #fff;
        margin-bottom: 8px;
        font-size: 24px;
        letter-spacing: 1px;
      }
      .admin-badge {
        text-align: center;
        color: #e50914;
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 30px;
      }

      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 13px;
        color: #aaa;
      }
      .form-group input {
        width: 100%;
        padding: 12px 15px;
        background: #1f1f1f;
        border: 1px solid #444;
        color: #fff;
        border-radius: 6px;
        font-size: 14px;
      }
      .form-group input:focus {
        border-color: #e50914;
        outline: none;
        box-shadow: 0 0 8px rgba(229, 9, 20, 0.3);
      }

      .btn-admin-submit {
        background-color: #e50914;
        color: white;
        border: none;
        padding: 14px;
        font-size: 15px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        transition: background 0.2s;
        box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .btn-admin-submit:hover {
        background-color: #b20710;
      }

      .back-home {
        text-align: center;
        margin-top: 25px;
        font-size: 14px;
      }
      .back-home a {
        color: #888;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
      }
      .back-home a:hover {
        color: #fff;
      }

      .security-note {
        margin-top: 25px;
        background: #1a1a1a;
        padding: 12px;
        border-radius: 6px;
        font-size: 12px;
        color: #777;
        text-align: center;
        border: 1px dashed #333;
      }
    </style>
  </head>
  <body>
    <div class="admin-login-box">
      <h2>🔒 QUẢN TRỊ HỆ THỐNG</h2>
      <div class="admin-badge">Admin Authentication Portal</div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label>Tài khoản Quản Trị:</label>
          <input
            type="text"
            id="adminUser"
            required
            placeholder="Nhập username admin..."
          />
        </div>
        <div class="form-group">
          <label>Mật khẩu Bảo Mật:</label>
          <input
            type="password"
            id="adminPass"
            required
            placeholder="Nhập mật khẩu admin..."
          />
        </div>
        <button type="submit" class="btn-admin-submit">
          Xác Thực Truy Cập Admin
        </button>
      </form>

      <div class="back-home">
        <a href="index.html">← Quay lại Trang Chủ Khách Hàng</a>
      </div>

      <div class="security-note">
        ⚠️ Khu vực hạn chế dành riêng cho quản trị viên cấp cao. Tài khoản khách
        hàng thông thường không có quyền truy cập.
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document
          .getElementById("adminLoginForm")
          .addEventListener("submit", (e) => {
            e.preventDefault();
            const u = document.getElementById("adminUser").value.trim();
            const p = document.getElementById("adminPass").value.trim();

            // Tài khoản admin mặc định
            if (u === "admin" && p === "123456") {
              // CHỈ LƯU PHIÊN ADMIN RIÊNG BIỆT, TUYỆT ĐỐI KHÔNG DÙNG currentUser = 'admin'
              localStorage.setItem("isAdminLoggedIn", "true");

              alert("Xác thực thành công! Chào mừng Quản Trị Viên.");
              window.location.href = "admin.html";
            } else {
              alert(
                "Sai tài khoản hoặc mật khẩu quản trị! Truy cập bị từ chối.",
              );
            }
          });
      });
    </script>
  </body>
</html>
