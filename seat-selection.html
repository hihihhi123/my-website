<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chọn Ghế Ngồi - Film Cinemas</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #141414 0%, #1f1f1f 100%);
        color: #fff;
        min-height: 100vh;
      }

      header {
        background-color: rgba(20, 20, 20, 0.95);
        border-bottom: 1px solid #333;
        padding: 15px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        margin: 0;
        font-size: 22px;
        color: #e50914;
        letter-spacing: 1px;
      }
      .nav-links a {
        color: #ccc;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 8px 16px;
        border-radius: 6px;
        transition: all 0.2s;
      }
      .nav-links a:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .container {
        max-width: 750px;
        margin: 40px auto;
        background: #1a1a1a;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border: 1px solid #333;
      }
      .movie-title {
        font-size: 26px;
        font-weight: bold;
        color: #fff;
        margin-bottom: 5px;
        text-align: center;
      }
      .theater-info {
        color: #e50914;
        margin-bottom: 25px;
        text-align: center;
        font-size: 15px;
        font-weight: 600;
      }

      .screen-container {
        perspective: 400px;
        margin: 20px 0 30px 0;
        text-align: center;
      }
      .screen {
        background: linear-gradient(to bottom, #777, #333);
        color: #fff;
        padding: 8px;
        border-radius: 4px;
        font-weight: bold;
        font-size: 12px;
        letter-spacing: 3px;
        box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5);
        transform: rotateX(-15deg);
        margin-bottom: 8px;
      }
      .screen-label {
        font-size: 11px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .seat-legend {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 25px;
        font-size: 13px;
        color: #aaa;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .legend-box {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }

      .seat-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 12px;
        margin-bottom: 30px;
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
      }
      .seat {
        padding: 12px 0;
        background-color: #2a2a2a;
        border: 1px solid #444;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        color: #ccc;
        text-align: center;
        font-size: 13px;
        transition: all 0.2s;
      }
      .seat:hover:not(.booked) {
        background-color: #3d3d3d;
        border-color: #777;
        color: #fff;
      }
      .seat.selected {
        background-color: #e50914 !important;
        color: #fff !important;
        border-color: #e50914;
        box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
      }
      .seat.booked {
        background-color: #333 !important;
        color: #666 !important;
        border-color: #222;
        cursor: not-allowed;
        opacity: 0.5;
        pointer-events: none;
      }

      .summary-box {
        background: #242424;
        border: 1px solid #383838;
        padding: 18px;
        border-radius: 8px;
        margin-bottom: 25px;
        border-left: 4px solid #e50914;
      }
      .summary-box p {
        margin-bottom: 8px;
        font-size: 14px;
        color: #ddd;
      }

      .btn-confirm-booking {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 14px 30px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        transition: background 0.2s;
        box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
      }
      .btn-confirm-booking:hover {
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎬 FILM CINEMAS</h1>
      <div class="nav-links">
        <span id="userGreeting" style="color: #ffc107; font-weight: 600"></span>
        <a href="select-showtime.html" id="backShowtime">← Đổi Suất Chiếu</a>
      </div>
    </header>

    <div class="container">
      <div class="movie-title" id="displayMovieTitle">Đang tải tên phim...</div>
      <div class="theater-info" id="displayInfo">
        Đang tải thông tin suất chiếu...
      </div>

      <div class="screen-container">
        <div class="screen">MÀN HÌNH CHIẾU</div>
        <div class="screen-label">SCREEN</div>
      </div>

      <div class="seat-legend">
        <div class="legend-item">
          <div
            class="legend-box"
            style="background: #2a2a2a; border: 1px solid #444"
          ></div>
          Ghế trống
        </div>
        <div class="legend-item">
          <div class="legend-box" style="background: #e50914"></div>
          Đang chọn
        </div>
        <div class="legend-item">
          <div class="legend-box" style="background: #333; opacity: 0.5"></div>
          Đã đặt
        </div>
      </div>

      <div class="seat-grid">
        <button class="seat">A1</button><button class="seat">A2</button
        ><button class="seat">A3</button><button class="seat">A4</button
        ><button class="seat">A5</button><button class="seat">A6</button
        ><button class="seat">A7</button><button class="seat">A8</button>
        <button class="seat">B1</button><button class="seat">B2</button
        ><button class="seat">B3</button><button class="seat">B4</button
        ><button class="seat">B5</button><button class="seat">B6</button
        ><button class="seat">B7</button><button class="seat">B8</button>
        <button class="seat">C1</button><button class="seat">C2</button
        ><button class="seat">C3</button><button class="seat">C4</button
        ><button class="seat">C5</button><button class="seat">C6</button
        ><button class="seat">C7</button><button class="seat">C8</button>
        <button class="seat">D1</button><button class="seat">D2</button
        ><button class="seat">D3</button><button class="seat">D4</button
        ><button class="seat">D5</button><button class="seat">D6</button
        ><button class="seat">D7</button><button class="seat">D8</button>
      </div>

      <div class="summary-box">
        <p>
          Ghế đã chọn:
          <strong class="selected-seats-text" style="color: #e50914"
            >Chưa chọn ghế nào</strong
          >
        </p>
        <p>
          Tổng tiền tạm tính:
          <strong class="total-price-text" style="color: #28a745">0 đ</strong>
          <span style="font-size: 12px; color: #888">(85.000đ / vé)</span>
        </p>
      </div>

      <button class="btn-confirm-booking">
        XÁC NHẬN ĐẶT VÉ & GỬI VỀ ADMIN
      </button>
    </div>

    <script>
      let selectedSeats = [];
      let movieTitle = "";
      let theaterName = "";
      let dateVal = "";
      let timeVal = "";

      document.addEventListener("DOMContentLoaded", () => {
        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
          alert("Vui lòng đăng nhập để chọn ghế!");
          window.location.href = "login.html";
          return;
        }
        document.getElementById("userGreeting").textContent =
          `👤 ${currentUser}`;

        const urlParams = new URLSearchParams(window.location.search);
        movieTitle = urlParams.get("title") || "Chị Chị Em Em 3";
        theaterName = urlParams.get("theater") || "Film Aeon Bình Tân";
        dateVal = urlParams.get("date") || "Hôm nay";
        timeVal = urlParams.get("time") || "09:30";

        document.getElementById("displayMovieTitle").textContent = movieTitle;
        document.getElementById("displayInfo").textContent =
          `📍 ${theaterName} | 📅 ${dateVal} - ⏰ ${timeVal}`;

        // Gắn link nút quay lại đổi suất chiếu kèm tham số phim
        document.getElementById("backShowtime").href =
          `select-showtime.html?title=${encodeURIComponent(movieTitle)}&theater=${encodeURIComponent(theaterName)}`;

        loadOccupiedSeats(movieTitle, theaterName, dateVal, timeVal);

        const seatButtons = document.querySelectorAll(".seat");
        seatButtons.forEach((btn) => {
          btn.addEventListener("click", () => {
            if (btn.classList.contains("booked")) return;
            btn.classList.toggle("selected");
            const seatId = btn.textContent.trim();

            if (btn.classList.contains("selected")) {
              selectedSeats.push(seatId);
            } else {
              selectedSeats = selectedSeats.filter((s) => s !== seatId);
            }
            updateBookingSummary(selectedSeats);
          });
        });

        const confirmBtn = document.querySelector(".btn-confirm-booking");
        confirmBtn.addEventListener("click", (e) => {
          e.preventDefault();
          if (selectedSeats.length === 0) {
            alert("Vui lòng chọn ít nhất một ghế trước khi đặt!");
            return;
          }
          saveNewTicket(
            movieTitle,
            theaterName,
            dateVal,
            timeVal,
            selectedSeats,
          );
        });
      });

      function loadOccupiedSeats(movieName, theaterName, date, time) {
        const tickets = JSON.parse(localStorage.getItem("tickets")) || [];
        let occupiedSeats = [];

        tickets.forEach((ticket) => {
          if (
            ticket.movieName === movieName &&
            ticket.theater.includes(theaterName) &&
            ticket.theater.includes(date) &&
            ticket.theater.includes(time) &&
            ticket.status === "Chưa xem"
          ) {
            if (ticket.seats) occupiedSeats.push(...ticket.seats);
          }
        });

        const seatButtons = document.querySelectorAll(".seat");
        seatButtons.forEach((btn) => {
          if (occupiedSeats.includes(btn.textContent.trim())) {
            btn.classList.add("booked");
            btn.setAttribute("disabled", "true");
          }
        });
      }

      function saveNewTicket(movieName, theaterName, date, time, seats) {
        const currentUser = localStorage.getItem("currentUser");
        const tickets = JSON.parse(localStorage.getItem("tickets")) || [];

        const newTicket = {
          id: Date.now(),
          movieName: movieName,
          theater: `${theaterName} (${date} - ${time})`,
          seats: seats,
          username: currentUser,
          bookingDate: new Date().toLocaleDateString(),
          status: "Chưa xem",
        };

        tickets.push(newTicket);
        localStorage.setItem("tickets", JSON.stringify(tickets));

        alert(
          "Đặt vé thành công! Thông tin vé đã được gửi vào trang Quản Trị (Admin).",
        );
        window.location.href = "index.html";
      }

      function updateBookingSummary(selectedSeats) {
        const seatDisplay = document.querySelector(".selected-seats-text");
        const totalPriceDisplay = document.querySelector(".total-price-text");
        const pricePerSeat = 85000;

        seatDisplay.textContent =
          selectedSeats.length > 0
            ? selectedSeats.join(", ")
            : "Chưa chọn ghế nào";
        totalPriceDisplay.textContent =
          (selectedSeats.length * pricePerSeat).toLocaleString("vi-VN") + " đ";
      }
    </script>
  </body>
</html>
